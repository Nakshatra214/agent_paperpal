services:
  - type: web
    name: ppal-backend
    env: docker
    region: ohio
    plan: free
    rootDir: backend
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_THINKING_BUDGET
        value: "2048"
